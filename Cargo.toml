[package]
name = "usenet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Reads Usenet releases as files: NNTP, yEnc, NZB, and stored RAR layouts"
repository = "https://github.com/AugusDogus/usenet-rs"
readme = "README.md"
keywords = ["usenet", "nntp", "yenc", "nzb", "rar"]
categories = ["network-programming", "parser-implementations", "encoding"]

[features]
# A loopback NNTP server and postings, for tests.
fake = []

[dependencies]
crc32fast = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
memchr = "2"
parking_lot = "0.12"
quick-xml = "0.42"
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = "0.26"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
# cargo-fuzz builds with --cfg fuzzing, which exposes the NNTP reply parser.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
