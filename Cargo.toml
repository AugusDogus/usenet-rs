[package]
name = "usenet"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Reads Usenet releases as files: NNTP, yEnc, NZB, stored RAR layouts, and PAR2 repair"
repository = "https://github.com/AugusDogus/usenet-rs"
readme = "README.md"
keywords = ["usenet", "nntp", "yenc", "nzb", "par2"]
categories = ["network-programming", "parser-implementations", "encoding"]
exclude = ["/fuzz", "/.github"]

[features]
# A loopback NNTP server and postings, for tests.
fake = []

[dependencies]
crc32fast = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
md-5 = "0.10"
memchr = "2"
parking_lot = "0.12"
quick-xml = "0.42"
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = "0.26"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "nntp"
harness = false
required-features = ["fake"]

[[bench]]
name = "rar"
harness = false
required-features = ["fake"]

[[bench]]
name = "yenc"
harness = false

[[bench]]
name = "nzb"
harness = false

[[bench]]
name = "par2"
harness = false
required-features = ["fake"]

[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing`, which exposes the NNTP reply parser and skips RAR
# header checksums and PAR2 packet hashes.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[[example]]
name = "priority"
required-features = ["fake"]
